[package]
name = "axonbase-sdk"
version = "0.1.0"
description = "AxonBase SDK para Rust — cliente WebSocket JSON-RPC"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = "0.23"
rustls-pemfile = "2"
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
url = "2"
thiserror = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
