name: Publish Coordinated Connector Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(<VERSION)
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
      - run: bash scripts/check-versions.sh

  validate:
    name: Validate ${{ matrix.connector }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        connector: [java, nodejs, python, dotnet, ruby, rust, go, php]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.connector == 'java'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        if: matrix.connector == 'nodejs'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: axonbase-sdk-nodejs/package-lock.json
      - uses: actions/setup-python@v5
        if: matrix.connector == 'python'
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        if: matrix.connector == 'dotnet'
        with:
          dotnet-version: '9.0.x'
      - uses: ruby/setup-ruby@v1
        if: matrix.connector == 'ruby'
        with:
          ruby-version: '3.2'
      - uses: actions/setup-go@v5
        if: matrix.connector == 'go'
        with:
          go-version: '1.22.x'
      - uses: shivammathur/setup-php@v2
        if: matrix.connector == 'php'
        with:
          php-version: '8.3'
      - if: matrix.connector == 'java'
        run: |
          mvn -B install -pl axonbase-sdk-java,axonbase-jdbc,axonbase-spring-data -am -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true -q
          mvn -B test -pl axonbase-sdk-java,axonbase-jdbc,axonbase-spring-data -Dgpg.skip=true -Dmaven.javadoc.skip=true
      - if: matrix.connector == 'nodejs'
        working-directory: axonbase-sdk-nodejs
        run: npm ci && npm test && npm run build && npm pack --dry-run
      - if: matrix.connector == 'python'
        run: python -m pip install -e 'axonbase-sdk-python[test]' build twine sqlalchemy openai && python -m pytest axonbase-sdk-python/tests && python -m build axonbase-sdk-python && python -m twine check axonbase-sdk-python/dist/*
      - if: matrix.connector == 'dotnet'
        run: dotnet run --project axonbase-sdk-dotnet/AxonBaseSdk.Tests/AxonBaseSdk.Tests.csproj -c Release && dotnet pack axonbase-sdk-dotnet/AxonBaseSdk/AxonBaseSdk.csproj -c Release -o ./artifacts/nuget
      - if: matrix.connector == 'ruby'
        working-directory: axonbase-sdk-ruby
        run: gem install websocket-client-simple -v '~> 0.7' --no-document && ruby -Ilib test/client_test.rb && gem build axonbase-sdk.gemspec
      - if: matrix.connector == 'rust'
        working-directory: axonbase-sdk-rust
        run: cargo test --all-targets && cargo package --allow-dirty
      - if: matrix.connector == 'go'
        working-directory: axonbase-sdk-go
        run: go test ./...
      - if: matrix.connector == 'php'
        working-directory: axonbase-sdk-php
        run: composer install --no-interaction --prefer-dist && composer test

  publish-java:
    needs: [version, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Set up Maven 3.9.16
        # Maven 3.10 writes local metadata into Central bundles, which Central rejects.
        env:
          MAVEN_VERSION: 3.9.16
          MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/maven.tar.gz" "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${MAVEN_SHA512}  ${RUNNER_TEMP}/maven.tar.gz" | sha512sum -c -
          tar -xzf "${RUNNER_TEMP}/maven.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "${GITHUB_PATH}"
      - name: Configure Maven publishing credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings><servers><server><id>central</id><username>${{ secrets.SONATYPE_USERNAME }}</username><password>${{ secrets.SONATYPE_PASSWORD }}</password></server></servers><profiles><profile><id>gpg</id><activation><activeByDefault>true</activeByDefault></activation><properties><gpg.executable>gpg</gpg.executable><gpg.passphrase>${{ secrets.GPG_PASSPHRASE }}</gpg.passphrase></properties></profile></profiles></settings>
          EOF
      - run: |
          mvn --version
          mvn -B -Pcentral-publishing deploy -DskipTests

  publish-nodejs:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
      - working-directory: axonbase-sdk-nodejs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@axonbase/sdk@${VERSION}" version >/dev/null 2>&1; then
            echo "npm: @axonbase/sdk@${VERSION} already published, skipping"
            exit 0
          fi
          npm ci && npm publish --access public

  publish-python:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build twine && python -m build axonbase-sdk-python
      - env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --skip-existing axonbase-sdk-python/dist/*

  publish-dotnet:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet pack axonbase-sdk-dotnet/AxonBaseSdk/AxonBaseSdk.csproj -c Release -o ./artifacts/nuget
      - env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push './artifacts/nuget/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-ruby:
    needs: [version, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - working-directory: axonbase-sdk-ruby
        env:
          GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gem list -r -a axonbase-sdk 2>/dev/null | grep -q "axonbase-sdk (${VERSION}"; then
            echo "rubygems: axonbase-sdk@${VERSION} already published, skipping"
            exit 0
          fi
          gem build axonbase-sdk.gemspec
          gem push *.gem

  publish-rust:
    needs: [version, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - working-directory: axonbase-sdk-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if cargo search axonbase-sdk 2>/dev/null | grep -q "axonbase-sdk = \"${VERSION}\""; then
            echo "crates.io: axonbase-sdk@${VERSION} already published, skipping"
            exit 0
          fi
          cargo publish

  publish-go:
    needs: [version, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="axonbase-sdk-go/v${VERSION}"
          git rev-parse "$tag" >/dev/null 2>&1 || git tag -a "$tag" -m "Go SDK v${VERSION}"
          git push origin "$tag"

  publish-php:
    needs: [version, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require PHP source repository credential
        env:
          SDK_PHP_REPO_TOKEN: ${{ secrets.SDK_PHP_REPO_TOKEN }}
        run: test -n "$SDK_PHP_REPO_TOKEN"
      - name: Synchronize the PHP SDK source and tag its release
        env:
          SDK_PHP_REPO_TOKEN: ${{ secrets.SDK_PHP_REPO_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git clone "https://x-access-token:${SDK_PHP_REPO_TOKEN}@github.com/axonbase/sdk-php.git" sdk-php-release
          rsync -a --delete --exclude .git axonbase-sdk-php/ sdk-php-release/
          cd sdk-php-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || git commit -m "release: SDK PHP v${VERSION}"
          git fetch --tags
          tag="v${VERSION}"
          git rev-parse "$tag" >/dev/null 2>&1 || git tag -a "$tag" -m "SDK PHP v${VERSION}"
          git push origin main --follow-tags

  release:
    needs: [version, publish-java, publish-nodejs, publish-python, publish-dotnet, publish-ruby, publish-rust, publish-go, publish-php]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v${VERSION}" --generate-notes --title "AxonBase ${VERSION}"
