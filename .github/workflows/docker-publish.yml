name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      suffix: ${{ steps.v.outputs.suffix }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "ver=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=-dev" >> "$GITHUB_OUTPUT"
          fi

  docker-amd64:
    name: Build AMD64
    needs: version
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.docker_build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: axonbase/axonbase:${{ needs.version.outputs.ver }}-amd64${{ needs.version.outputs.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-arm64:
    name: Build ARM64
    needs: version
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.docker_build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: axonbase/axonbase:${{ needs.version.outputs.ver }}-arm64${{ needs.version.outputs.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    name: Multi-arch manifest
    needs: [version, docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          VERSION="${{ needs.version.outputs.ver }}${{ needs.version.outputs.suffix }}"
          docker buildx imagetools create \
            -t "axonbase/axonbase:${VERSION}" \
            -t "axonbase/axonbase:latest" \
            "axonbase/axonbase:${VERSION}-amd64" \
            "axonbase/axonbase:${VERSION}-arm64"