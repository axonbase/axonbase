name: Validate Connectors

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  versions:
    name: Verify coordinated version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-versions.sh

  java:
    name: Java, JDBC and Spring Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: |
          mvn -B install -pl axonbase-sdk-java,axonbase-spring-data -am -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true -q
          mvn -B test -pl axonbase-sdk-java,axonbase-spring-data -Dgpg.skip=true -Dmaven.javadoc.skip=true

  nodejs:
    name: Node.js SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: axonbase-sdk-nodejs/package-lock.json
      - working-directory: axonbase-sdk-nodejs
        run: |
          npm ci
          npm test
          npm run build
          npm pack --dry-run

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: axonbase-sdk-python/pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'axonbase-sdk-python[test]' build twine sqlalchemy openai
          python -m pytest axonbase-sdk-python/tests
          python -m build axonbase-sdk-python
          python -m twine check axonbase-sdk-python/dist/*

  dotnet:
    name: .NET SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: |
          dotnet run --project axonbase-sdk-dotnet/AxonBaseSdk.Tests/AxonBaseSdk.Tests.csproj -c Release
          dotnet pack axonbase-sdk-dotnet/AxonBaseSdk/AxonBaseSdk.csproj -c Release -o ./artifacts/nuget

  ruby:
    name: Ruby SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - working-directory: axonbase-sdk-ruby
        run: |
          gem install websocket-client-simple -v '~> 0.7' --no-document
          ruby -Ilib test/client_test.rb
          gem build axonbase-sdk.gemspec

  rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - working-directory: axonbase-sdk-rust
        run: |
          cargo test --all-targets
          cargo package --allow-dirty

  go:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: axonbase-sdk-go/go.sum
      - working-directory: axonbase-sdk-go
        run: go test ./...

  php:
    name: PHP SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - working-directory: axonbase-sdk-php
        run: |
          composer install --no-interaction --prefer-dist
          composer test
