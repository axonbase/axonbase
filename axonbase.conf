# AxonBase: production config with RocksDB storage.
# lang = pt-BR (default) | en (English)
path = data
bind = 127.0.0.1
port = 8443
plain_port = 8080
require_auth = true
secret = axonbase-dev-secret
user = root
pass = root
tls_cert = certs/server/server.p12
tls_key = changeit
tls_ca = certs/truststores/icpbrasil.jks
http_threads = 12
lang = en
