[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "axonbase-sdk"
version = "0.1.0"
description = "AxonBase SDK para Python — cliente WebSocket JSON-RPC"
requires-python = ">=3.10"
dependencies = ["websockets>=14.0"]
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]
openai = ["openai>=1.0"]
langchain = ["langchain-core>=0.2"]
agno = ["agno>=1.0"]

[project.urls]
homepage = "https://github.com/alvaro-brito-products/axonbase"

[tool.setuptools.packages.find]
where = ["."]
include = ["axonbase*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
