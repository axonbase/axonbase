[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "axonbase-sdk"
version = "0.1.1"
description = "AxonBase WebSocket JSON-RPC client for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["websockets>=14.0"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AxonBase"}]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]
openai = ["openai>=1.0"]
langchain = ["langchain-core>=0.2"]
agno = ["agno>=1.0"]

[project.urls]
Homepage = "https://github.com/axonbase/axonbase"
Repository = "https://github.com/axonbase/axonbase"
Issues = "https://github.com/axonbase/axonbase/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["axonbase*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
